name: mercur-railway-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mercur
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercur"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "9001:9000"
      - "9002:9001"

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/medusa-media &&
        mc anonymous set download local/medusa-media

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mercur
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:5173
      VENDOR_CORS: http://localhost:7000
      AUTH_CORS: http://localhost:3000,http://localhost:5173,http://localhost:7000
      JWT_SECRET: local-only-jwt-secret
      COOKIE_SECRET: local-only-cookie-secret
      MEDUSA_ADMIN_EMAIL: admin@local.test
      MEDUSA_ADMIN_PASSWORD: local-admin-password
      BACKEND_URL: http://localhost:9000
      S3_FILE_URL: http://localhost:9001/medusa-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: medusa-media
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    ports:
      - "9000:9000"

volumes: {}
